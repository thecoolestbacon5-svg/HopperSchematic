name: Build Hopper Schematic Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/hopper-schematic-*.jar
        tag_name: v1.0.0
        name: Hopper Schematic Mod v1.0.0
        body: Fabric mod for Minecraft 1.21.11
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
