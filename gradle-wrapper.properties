#!/bin/bash
set -e

GRADLE_USER_HOME="${GRADLE_USER_HOME:=$HOME/.gradle}"
GRADLE_APP_HOME=$(cd "$(dirname "$0")" && pwd)

if [ ! -d "$GRADLE_USER_HOME/wrapper/dists" ]; then
    mkdir -p "$GRADLE_USER_HOME/wrapper/dists"
fi

GRADLE_URL="https://services.gradle.org/distributions/gradle-8.5-bin.zip"
GRADLE_ZIP="$GRADLE_USER_HOME/wrapper/dists/gradle-8.5-bin.zip"

if [ ! -f "$GRADLE_ZIP" ]; then
    echo "Downloading Gradle..."
    mkdir -p "$(dirname "$GRADLE_ZIP")"
    curl -fsSL "$GRADLE_URL" -o "$GRADLE_ZIP"
fi

GRADLE_HOME="$GRADLE_USER_HOME/wrapper/dists/gradle-8.5"
if [ ! -d "$GRADLE_HOME" ]; then
    echo "Extracting Gradle..."
    unzip -q "$GRADLE_ZIP" -d "$(dirname "$GRADLE_HOME")"
    rm "$GRADLE_ZIP"
fi

"$GRADLE_HOME/bin/gradle" "$@"
